<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>文件浏览</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="nav-row list-nav">
      <div class="brand compact">
        <div>
          <div class="title" id="dirTitle">正在加载…</div>
          <div class="subtitle pathline" id="pathLine"></div>
        </div>
      </div>
      <div class="actions">
        <button type="button" id="refreshBtn" class="btn" title="刷新当前目录">刷新</button>
        <button type="button" class="btn icon" id="moreBtn" aria-haspopup="menu" aria-expanded="false" title="更多操作">⋮</button>
      </div>
      <div class="more-menu" id="moreMenu" role="menu" hidden>
        <label class="mi mi-check">
          <span>显示隐藏文件</span>
          <input type="checkbox" id="hiddenToggle" />
          <span class="check-mark" aria-hidden="true"></span>
        </label>
        <button type="button" class="mi" id="miCopyPath" role="menuitem">复制完整路径</button>
        <button type="button" class="mi" id="miCopyName" role="menuitem">复制文件名</button>
        <button type="button" class="mi mi-expand" id="sortToggle" aria-expanded="false" role="menuitem">
          <span>排序方式</span><span class="mi-note" id="sortNote">名称正序</span>
        </button>
        <div class="sub-menu" id="sortMenu" hidden>
          <button type="button" class="mi" data-sort="name:asc">名称正序</button>
          <button type="button" class="mi" data-sort="name:desc">名称倒序</button>
          <button type="button" class="mi" data-sort="time:asc">时间正序</button>
          <button type="button" class="mi" data-sort="time:desc">时间倒序</button>
        </div>
        <button type="button" class="mi" id="aboutBtn" role="menuitem">关于</button>
      </div>
    </div>
  </header>

  <main class="layout">
    <aside class="panel side" id="sidePanel">
      <div class="panel-head">
        <h2>目录</h2>
        <button type="button" id="closeSide" class="btn ghost">关闭</button>
      </div>
      <div class="tree" id="tree"></div>
    </aside>

    <section class="panel main" id="mainPanel">
      <div class="toolbar">
        <span class="count-badge" id="countBadge">…</span>
        <button type="button" id="openSideBtn" class="btn ghost">目录树</button>
        <input id="searchInput" class="search" type="search" placeholder="筛选当前目录…" />
      </div>
      <div class="list-wrap">
        <table class="file-table" id="fileTable">
          <thead>
            <tr>
              <th>名称</th>
              <th>大小</th>
              <th>修改时间</th>
            </tr>
          </thead>
          <tbody id="fileBody">
            <tr><td colspan="3" class="muted">加载中…</td></tr>
          </tbody>
        </table>
      </div>
      <div class="empty" id="emptyState" hidden>
        <p>空目录或无可显示文件</p>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" hidden></div>

  <div class="modal" id="aboutModal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="aboutTitle">
      <h3 id="aboutTitle">关于 android lan file server</h3>
      <p class="about-version">版本 {{ version }}</p>
      <p class="about-repo">
        仓库：
        <a href="https://gitee.com/cuncaojin/android-lan-file-server" target="_blank" rel="noopener">Gitee</a>
        <span class="sep">·</span>
        <a href="https://github.com/cuncaojin/android-lan-file-server" target="_blank" rel="noopener">GitHub</a>
      </p>
      <p>局域网文件浏览器与在线预览服务：</p>
      <ul>
        <li>纯本地运行，文件不经过任何公网服务器</li>
        <li>支持 PDF / Office / Markdown / 纯文本 / 图片 / 音视频在线预览</li>
        <li>下载、原始文件、复制完整路径与文件名</li>
        <li>无访问认证，请仅在可信局域网中使用</li>
      </ul>
      <p class="hint">根目录：<code>{{ root_path }}</code></p>
      <div class="modal-actions">
        <button type="button" class="btn" id="aboutClose">关闭</button>
      </div>
    </div>
  </div>

  <script>
    window.__ANDROID_LAN__ = {
      rootName: {{ root_name|tojson }},
      rootPath: {{ root_path|tojson }},
      soffice: {{ soffice|tojson }},
      allowOutside: {{ allow_outside|tojson }},
      version: {{ version|tojson }},
      startPath: {{ start_path|tojson }}
    };
  </script>
  <script src="/static/md.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>

# android-lan-file-server 配置
# 默认浏览根目录
DEFAULT_ROOT=/sdcard
# 是否允许访问根目录以外路径/文件
#   no  = 默认，仅限 DEFAULT_ROOT 及其子目录
#   yes = 允许访问根目录以外
ALLOW_OUTSIDE_ROOT=no
# 监听地址
#   0.0.0.0     = 本机 + 局域网均可访问（默认推荐，便于分享目录）
#   127.0.0.1   = 仅手机本机回环访问
ANDROID_LAN_HOST=0.0.0.0
ANDROID_LAN_PORT=9523
ANDROID_LAN_HOME=/opt/android-lan-file-server
ANDROID_LAN_CACHE=/tmp/android-lan-file-server-cache
# 是否后台常驻
#   no  = 默认，服务跟随当前终端，关闭终端后停止
#   yes = 后台常驻，关闭终端后仍可访问
#         （日志 logs/android-lan-file-server.log，PID /tmp/android-lan-file-server.pid）
ANDROID_LAN_DAEMON=no
